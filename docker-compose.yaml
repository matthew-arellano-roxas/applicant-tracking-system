services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: applicant_tracking_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d applicant_tracking_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ats-workspace:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/applicant_tracking_system?schema=public
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      SMTP_USER: your-email@example.com
      SMTP_PASS: replace-with-smtp-password
      GROQ_API_KEY: replace-with-groq-api-key
      SUPABASE_PROJECT_URL: https://your-project.supabase.co
      SUPABASE_PUBLISHABLE_KEY: replace-with-supabase-publishable-key
      SUPABASE_SECRET_KEY: replace-with-supabase-secret-key
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_ACCESS_SECRET: replace-with-a-different-long-random-secret
      JWT_REFRESH_SECRET: replace-with-another-long-random-secret
    command:
      - sh
      - -c
      - pnpm --filter @ats/api exec prisma db push && pnpm --filter @ats/api dev:api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: ats-worker:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/applicant_tracking_system?schema=public
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      SMTP_USER: your-email@example.com
      SMTP_PASS: replace-with-smtp-password
      GROQ_API_KEY: replace-with-groq-api-key
      SUPABASE_PROJECT_URL: https://your-project.supabase.co
      SUPABASE_PUBLISHABLE_KEY: replace-with-supabase-publishable-key
      SUPABASE_SECRET_KEY: replace-with-supabase-secret-key
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_ACCESS_SECRET: replace-with-a-different-long-random-secret
      JWT_REFRESH_SECRET: replace-with-another-long-random-secret
    command: ["pnpm", "--filter", "@ats/api", "dev:worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ats-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-cache-data:
  redis-queue-data:
